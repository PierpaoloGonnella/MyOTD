name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      JUNIT_VERSION: 1.10.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download JUnit console launcher
        run: curl -sSfL -o junit.jar "https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/${JUNIT_VERSION}/junit-platform-console-standalone-${JUNIT_VERSION}.jar"
      - name: Compile model classes and tests
        run: |
          M=app/src/main/java/com/example/pc/myotd/Model
          javac -d out -cp junit.jar \
            $M/Capo.java $M/Categoria.java $M/IttenColor.java $M/IttenAlgorithm.java \
            $M/Busto.java $M/Gambe.java $M/Piedi.java $M/Testa.java \
            app/src/test/java/com/example/pc/myotd/Model/*.java
      - name: Run tests
        run: java -jar junit.jar execute -cp out --select-package com.example.pc.myotd.Model --fail-if-no-tests
